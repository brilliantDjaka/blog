baseURL = "https://brilliantdjaka.github.io/blog/"
locale = "en-us"
defaultContentLanguage = "en"
title = "Brilliant's Blog"

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true

# theme
theme = "DoIt"

# site description
# 网站描述
description = "Personal blog of Brilliant Djaka"

[params]
  # website title
  # 网站标题
  title = "Brilliant's Blog"
  # site default theme ("light", "dark", "black", "auto")
  defaultTheme = "auto"
  # public git repo url only then enableGitInfo is true
  gitRepo = "https://github.com/brilliantDjaka/blog"
  # which hash function used for SRI, when empty, no SRI is used ("sha256", "sha384", "sha512", "md5")
  fingerprint = ""
  # date format
  dateFormat = "2006-01-02"

  [params.author]
    name = "Brilliant Djaka"
    gravatarEmail = "brian.rofiq@gmail.com"
    link = "https://github.com/brilliantDjaka"

  [params.home]
    # amount of RSS pages
    rss = 10
    [params.home.profile]
      enable = true
      title = "Brilliant's Blog"
      subtitle = "Personal blog of Brilliant Djaka"
      typeit = false
      social = true
    [params.home.posts]
      enable = true
      paginate = 10

  # Header config
  [params.header]
    # theme change mode ("switch", "select")
    themeChangeMode = "select"
    [params.header.title]
      logo = ""
      name = "Brilliant's Blog"

  # Footer config
  [params.footer]
    enable = true
    hugo = true
    hostedOn = '<a title="Github Pages" href="https://docs.github.com/en/pages/" target="_blank" rel="noopener noreferrer">GitHub Pages</a>'
    copyright = true
    author = true
    since = 2026

  # Social config in home page
  [params.social]
    Email = "brian.rofiq@gmail.com"
    GitHub = "brilliantDjaka"
    RSS = true

  # Page config
  [params.page]
    # whether to show link to Raw Markdown content of the content
    linkToMarkdown = true
    linkToSource = "https://github.com/brilliantDjaka/blog/blob/main/{path}"
    linkToEdit = "https://github.com/brilliantDjaka/blog/edit/main/{path}"
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      maxShownLines = 10
      lineNos = true
      wrap = false
      header = true
    [params.page.math]
      enable = false
    [params.page.comment]
      enable = false
    [params.page.related]
      enable = true
      count = 5

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[taxonomies]
  author = "authors"
  category = "categories"
  tag = "tags"
  series = "series"

[outputs]
  home = ["HTML", "RSS", "JSON", "JsonFeed"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

[outputFormats.JsonFeed]
  mediaType = "application/feed+json"
  isPlainText = true
  notAlternative = true

[mediaTypes."text/plain"]
  suffixes = ["md"]

[mediaTypes."application/feed+json"]
  suffixes = ["feed"]

[permalinks]
  posts = ":contentbasename"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[pagination]
  pagerSize = 10

# Menu config
[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 2
[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 3
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 9
